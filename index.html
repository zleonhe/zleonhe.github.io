<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zhuolun He — homepage moved</title>
  <link rel="canonical" href="https://eda.cs.tsinghua.edu.cn/~zlhe/">
  <meta http-equiv="refresh" content="2; url=https://eda.cs.tsinghua.edu.cn/~zlhe/">
  <script>
    const destination = new URL('https://eda.cs.tsinghua.edu.cn/~zlhe/');
    destination.pathname += window.location.pathname.replace(/^\/+/, '');
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
</head>
<body>
  <p>My homepage has moved to <a href="https://eda.cs.tsinghua.edu.cn/~zlhe/">Tsinghua University</a>.</p>
</body>
</html>
